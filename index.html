<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Vidhwaan Booking</title>

<meta name="description" content="Book professional Vidhwaans for your events easily.">

<link rel="icon" href="./favicon.ico">

<!-- PWA -->

<link rel="manifest" href="./manifest.json">

<!-- CSS -->

<link rel="stylesheet" href="./css/design-system.css">
<link rel="stylesheet" href="./css/main.css">

</head>

<body>

<!-- NAV -->

<div id="nav"></div>

<!-- HERO -->

<div id="hero"></div>

<!-- BOOKING -->

<div id="registration"></div>

<!-- FOOTER -->

<div id="footer"></div>

<!-- MODULE LOAD -->

<script type="module">

import { loadNav } from "./utilities/nav.js"
import { loadHero } from "./utilities/hero.js"
import { loadFooter } from "./utilities/footer.js"
import { loadRegistration } from "./utilities/registration.js"

loadNav()
loadHero()
loadRegistration()
loadFooter()

</script>

<!-- SERVICE WORKER -->



<!-- OPTIONAL CARD HOVER EFFECT -->

<script>

document.addEventListener("mousemove", (e) => {

document.querySelectorAll(".card").forEach(card => {

const rect = card.getBoundingClientRect();

const x = e.clientX - rect.left;
const y = e.clientY - rect.top;

card.style.setProperty("--x", x + "px");
card.style.setProperty("--y", y + "px");

});

});

</script>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js");
}
</script>


</body>
</html>
