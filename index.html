<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Book Nadaswaram, Dolu, Saxophone & Drum Artists in India | Vidhwaan</title>

<meta name="description" content="Book Nadaswaram, Dolu, Saxophone and Drum artists anywhere in India. Wedding, temple and event Vidhwaans available near you instantly.">

<meta name="robots" content="index, follow">

<meta name="googlebot" content="index, follow, max-snippet:-1, max-image-preview:large">

<link rel="canonical" id="canonical" href="https://booking.vidhwaan.com/">

<meta property="og:title" content="Book Vidhwaans in India">
<meta property="og:description" content="Nadaswaram, Dolu, Saxophone & Drum booking platform across India.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://booking.vidhwaan.com/">
  
<link rel="icon" href="./favicon.ico">

<!-- PWA -->

<link rel="manifest" href="./manifest.json">

<!-- CSS -->

<link rel="stylesheet" href="./css/design-system.css">
<link rel="stylesheet" href="./css/main.css">


<script type="application/ld+json">
{
"@context": "https://schema.org",
"@type": "LocalBusiness",
"name": "Vidhwaan Booking",
"areaServed": "India",
"serviceType": "Wedding Music Services",
"url": "https://booking.vidhwaan.com/"
}
</script>
  

</head>

<body>

<!-- NAV -->

<div id="nav"></div>

<!-- HERO -->

<div id="hero"></div>

<!-- BOOKING -->

<!-- SEO CONTENT -->
<div id="seo-content" style="padding:20px;"></div>

<!-- BOOKING -->
<div id="registration"></div>

<!-- FOOTER -->

<div id="footer"></div>

<!-- MODULE LOAD -->

<script type="module">

import { loadNav } from "./utilities/nav.js"
import { loadHero } from "./utilities/hero.js"
import { loadFooter } from "./utilities/footer.js"
import { loadRegistration } from "./utilities/registration.js"

let path = location.pathname;

/* handle geo hash routing */
if(location.hash){
  path = location.hash.slice(1);
}



/* 🔥 FINAL WORLD-CLASS ROUTING (CACHED DATA VERSION) */

let GEO_CACHE = null;

/* LOAD DATA ONCE */
async function loadGeoData(){
  if(GEO_CACHE) return GEO_CACHE;

  const [g1, g2, g3, g4] = await Promise.all([
    fetch("./geo_dataset_1.json").then(r => r.json()),
    fetch("./geo_dataset_2.json").then(r => r.json()),
    fetch("./geo_dataset_3.json").then(r => r.json()),
    fetch("./geo_dataset_4.json").then(r => r.json())
  ]);

  GEO_CACHE = { ...g1, ...g2, ...g3, ...g4 };
  return GEO_CACHE;
}

/* MAIN ROUTING */
(async () => {

  const GEO = await loadGeoData();

  let cleanPath = path
    .replace(/\/+/g, "/")
    .replace(/\/$/, "")
    .toLowerCase();

  /* homepage */
  if(cleanPath === "" || cleanPath === "/"){
    return;
  }

  /* GEO ROUTE */
  if(cleanPath.startsWith("/geo")){

    const parts = cleanPath.split("/").filter(Boolean);

    let isValid = false;

    try {

      const state = parts[1];
      const district = parts[2];
      const mandal = parts[3];
      const village = parts[4];

      if(state && GEO[state]){

        if(!district){
          isValid = true;
        }

        else if(GEO[state].districts[district]){

          if(!mandal){
            isValid = true;
          }

          else if(GEO[state].districts[district].subdistricts[mandal]){

            if(!village){
              isValid = true;
            }

            else {
              const villages = GEO[state].districts[district].subdistricts[mandal].villages;

              if(villages.some(v => v.slug === village)){
                isValid = true;
              }
            }
          }
        }
      }

    } catch(e){
      isValid = false;
    }

    /* ❌ INVALID */
    if(!isValid){
      location.replace("/");
      return;
    }

    /* enforce trailing slash */
    cleanPath = cleanPath + "/";

    if(cleanPath !== path){
      location.replace("/#" + cleanPath);
      return;
    }

  } else {
    location.replace("/");
    return;
  }

})();
  

  


/* GEO SEO (TOP RANKING VERSION) */
if(parts[0] === "geo"){

  function format(s){
    return s ? s.replaceAll("-", " ").replace(/\b\w/g, l => l.toUpperCase()) : "";
  }

  const state = format(parts[1]);
  const district = format(parts[2]);
  const mandal = format(parts[3]);
  const village = format(parts[4]);

  let title = "Book Vidhwaans in India";
  let desc = "Book Nadaswaram, Dolu artists anywhere in India.";

  let displayText = "";
  let richContent = "";

  const locationName = village || mandal || district || state;

  if(village){
    title = `Book Nadaswaram & Dolu in ${village}`;
    desc = `Book Nadaswaram, Dolu, Saxophone and Drum artists in ${village}, ${mandal}, ${district}, ${state}.`;

    displayText = `Nadaswaram & Dolu artists available in ${village}.`;

    richContent = `
      <h2>Best Vidhwaans in ${village}</h2>
      <p>Professional Nadaswaram, Dolu, Saxophone and Drum artists are available in ${village} for weddings, temple events, and functions.</p>

      <h2>Services Available</h2>
      <ul>
        <li>Nadaswaram for weddings</li>
        <li>Dolu melam teams</li>
        <li>Temple and procession music</li>
      </ul>
    `;
  }

  /* TITLE */
  document.title = title;

  /* CANONICAL */
  const canonical = document.getElementById("canonical");
  if (canonical) {
    const cleanPath = path.replace(/^\/+/, "");
    canonical.setAttribute(
      "href",
      cleanPath ? location.origin + "/#" + cleanPath : location.origin + "/"
    );
  }

  /* META */
  let meta = document.querySelector("meta[name='description']");
  if(meta) meta.setAttribute("content", desc);

  /* SAFE MINIMAL UI CONTENT */
  const seoDiv = document.getElementById("seo-content");
  if(seoDiv){
    seoDiv.innerHTML = `
      <p style="text-align:center; opacity:0.6; font-size:12px;">
        ${displayText}
      </p>
      <div style="display:none;">
        ${richContent}
      </div>
    `;
  }

  /* FAQ SCHEMA */
  const faq = {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [{
      "@type": "Question",
      "name": `Can I book Nadaswaram in ${locationName}?`,
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes, professional Vidhwaans are available for weddings and events."
      }
    }]
  };

  /* BREADCRUMB SCHEMA */
  const breadcrumb = {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
      {
        "@type": "ListItem",
        "position": 1,
        "name": state,
        "item": `https://booking.vidhwaan.com/#/geo/${parts[1]}/`
      },
      {
        "@type": "ListItem",
        "position": 2,
        "name": district,
        "item": `https://booking.vidhwaan.com/#/geo/${parts[1]}/${parts[2]}/`
      }
    ]
  };

  const faqScript = document.createElement("script");
  faqScript.type = "application/ld+json";
  faqScript.text = JSON.stringify(faq);
  document.head.appendChild(faqScript);

  const breadcrumbScript = document.createElement("script");
  breadcrumbScript.type = "application/ld+json";
  breadcrumbScript.text = JSON.stringify(breadcrumb);
  document.head.appendChild(breadcrumbScript);
}
  

  
/* NORMAL LOAD */
loadNav()
loadHero()
loadRegistration()
loadFooter()

</script>

<!-- SERVICE WORKER -->



<!-- OPTIONAL CARD HOVER EFFECT -->

<script>

document.addEventListener("mousemove", (e) => {

document.querySelectorAll(".card").forEach(card => {

const rect = card.getBoundingClientRect();

const x = e.clientX - rect.left;
const y = e.clientY - rect.top;

card.style.setProperty("--x", x + "px");
card.style.setProperty("--y", y + "px");

});

});

</script>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js");
}
</script>


</body>
</html>
